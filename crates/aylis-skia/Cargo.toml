[package]
name = "aylis-skia"
description = "Renderizador Skia do Aylis: implementa Canvas e TextService (CPU e GPU)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Desenho na GPU via OpenGL.
gl = ["skia-safe/gl"]

[dependencies]
aylis-core = { version = "0.9.2", path = "../aylis-core" }
skia-safe = { version = "0.153", features = ["textlayout", "embed-icudtl"] }
# Quais símbolos são emoji de apresentação de texto (`⚠`, `ℹ`): saem monocromáticos, como no
# navegador. Só tabelas, sem dependências.
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji"] }
