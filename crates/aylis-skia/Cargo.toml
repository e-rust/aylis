[package]
name = "aylis-skia"
description = "Renderizador Skia do Aylis: implementa Canvas e TextService (CPU e GPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Desenho na GPU via OpenGL.
gl = ["skia-safe/gl"]

[dependencies]
aylis-core = { version = "0.2.0-beta.4", path = "../aylis-core" }
skia-safe = { version = "0.153", features = ["textlayout", "embed-icudtl"] }
