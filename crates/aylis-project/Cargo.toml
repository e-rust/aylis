[package]
name = "aylis-project"
description = "Projetos do Aylis: o .aylisproj, a pasta do projeto, a fábrica de forms, os recursos e a geração de código"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.1.0", path = "../aylis-core" }
aylis-vector = { version = "0.1.0", path = "../aylis-vector" }
aylis-json = { version = "0.1.0", path = "../aylis-json" }
aylis-build = { version = "0.1.0", path = "../aylis-build" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Para atualizar o Cargo.toml de projetos antigos sem perder comentários e edições.
toml_edit = "0.25"

# A junção `.aylis/sdk` do projeto até o aylis instalado (sem administrador, sem shell).
[target.'cfg(windows)'.dependencies]
junction = "1"

[dev-dependencies]
aylis-build = { path = "../aylis-build" }
aylis-controls = { path = "../aylis-controls" }
