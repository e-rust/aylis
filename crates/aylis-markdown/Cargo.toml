[package]
name = "aylis-markdown"
description = "Componente Markdown do Aylis: texto rico (títulos, listas, tabelas, código, links) desenhado pelo Canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.2.0-beta.6", path = "../aylis-core" }
# O realce dos blocos de código (o mesmo do `Memo`).
aylis-controls-base = { version = "0.2.0-beta.6", path = "../aylis-controls-base" }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
aylis-controls = { path = "../aylis-controls" }
aylis-skia = { path = "../aylis-skia" }
