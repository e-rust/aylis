[package]
name = "aylis-vector"
description = "Desenhos vetoriais do aylis: animações Lottie e imagens SVG, desenhadas pelo Canvas (Skia, Direct2D e navegador)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { path = "../aylis-core" }
serde_json = "1"
roxmltree = "0.20"

[dev-dependencies]
aylis-controls = { path = "../aylis-controls" }
aylis-skia = { path = "../aylis-skia" }

[target.'cfg(windows)'.dev-dependencies]
aylis-d2d = { path = "../aylis-d2d" }
