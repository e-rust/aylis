[package]
name = "aylis-dbcontrols"
description = "Controles ligados a dados do Aylis (DBEdit, DBText, DBCheckBox, DBNavigator)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.12.0", path = "../aylis-core" }
aylis-controls = { version = "0.12.0", path = "../aylis-controls" }
aylis-data = { version = "0.12.0", path = "../aylis-data" }
# As colunas e o rodapé do DataGrid são listas de registros em JSON.
serde_json = "1"
# As imagens dos relatórios (PNG, JPEG) viram pixels para o PDF e a impressora.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
aylis-json = { path = "../aylis-json" }
serde_json = "1"
# Abrir o PDF dos relatórios nos testes.
aylis-docview = { path = "../aylis-docview" }
# O PDF dos relatórios (o núcleo não escreve PDF): o provedor padrão, o krilla.
aylis-providers = { path = "../aylis-providers" }
# A pintura de verdade no exemplo do texto patológico (examples/pathological_text.rs).
aylis-skia = { path = "../aylis-skia" }
