[package]
name = "aylis-providers"
description = "Provedores do Aylis (código de barras, exportação CSV e XLSX, PDF, servidor de mapa) e os componentes que os usam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.1.0", path = "../aylis-core" }
aylis-data = { version = "0.1.0", path = "../aylis-data" }
# O QR Code do provedor padrão de códigos de barras (sem dependências).
qrcode = { version = "0.14", default-features = false }
# A planilha do XlsxProvider.
rust_xlsxwriter = { version = "0.102", default-features = false }

[dev-dependencies]
aylis-controls = { path = "../aylis-controls" }
aylis-dbcontrols = { path = "../aylis-dbcontrols" }
zip = { version = "9", default-features = false, features = ["deflate"] }
