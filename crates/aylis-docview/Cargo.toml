[package]
name = "aylis-docview"
description = "Visualizador de documentos do Aylis: PDF (hayro), planilhas (XLSX, XLS, ODS, CSV) e textos (DOCX, ODT)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.2.0-beta.1", path = "../aylis-core" }
hayro = "0.8"
calamine = "0.38"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
