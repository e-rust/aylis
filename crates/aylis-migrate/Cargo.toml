[package]
name = "aylis-migrate"
description = "Converte projetos do aylis de um formato para o seguinte (a lógica antiga fica fora do aylis e da IDE)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Não vai para o crates.io: só a fachada `aylis` e as bibliotecas dela (decidido em 09/11).
publish = false

[dependencies]
aylis-project = { path = "../aylis-project" }
aylis-json = { path = "../aylis-json" }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
