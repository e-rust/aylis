[package]
name = "aylis-controls"
description = "Controles padrão do Aylis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Os controles moram em crates por família (compilam em paralelo); este junta todos e
# registra as classes.
[dependencies]
aylis-core = { version = "0.2.1-beta.1", path = "../aylis-core" }
aylis-controls-base = { version = "0.2.1-beta.1", path = "../aylis-controls-base" }
aylis-controls-charts = { version = "0.2.1-beta.1", path = "../aylis-controls-charts" }
aylis-controls-device = { version = "0.2.1-beta.1", path = "../aylis-controls-device" }
aylis-controls-editors = { version = "0.2.1-beta.1", path = "../aylis-controls-editors" }
aylis-controls-industrial = { version = "0.2.1-beta.1", path = "../aylis-controls-industrial" }

[dev-dependencies]
serde_json = "1"
# Os testes dos modos de texto (`layout` e `core`) usam o motor de texto do núcleo.
aylis-core = { version = "0.2.1-beta.1", path = "../aylis-core", features = ["text-shaping"] }
# O teste de pintar por parte x por inteiro compara pixels de verdade.
aylis-skia = { path = "../aylis-skia" }
# A área de transferência cola um PNG no PaintBox.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dev-dependencies]
aylis-d2d = { path = "../aylis-d2d" }
