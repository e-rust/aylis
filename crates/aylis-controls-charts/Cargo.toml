[package]
name = "aylis-controls-charts"
description = "Gráficos, BI, trader, grafo de nós e mapa do Aylis"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.12.1", path = "../aylis-core" }
# GeoJSON do mapa coroplético e os registros (séries, marcadores, ofertas) em JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A pintura de verdade na medição da série enorme (tests/huge_series.rs).
aylis-skia = { path = "../aylis-skia" }
