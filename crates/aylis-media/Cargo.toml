[package]
name = "aylis-media"
description = "Áudio e vídeo do Aylis: MediaPlayer, VideoPlayer, decodificadores plugáveis (Media Foundation no Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["http"]
# O som por endereço (`https://...`) lido aos poucos, com `Range`, pelo Symphonia (o ureq, com
# rustls; o mesmo que o aylis-platform-winit já usa). Sem ela, no Windows o Media Foundation
# ainda abre o endereço.
http = ["dep:ureq"]

[dependencies]
aylis-core = { version = "0.2.0", path = "../aylis-core" }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
cpal = "0.18"
# Foto da câmera em PNG.
png = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
    # As texturas e cercas compartilhadas do vídeo (CreateSharedHandle).
    "Win32_Security",
    "Win32_System_Variant",
] }

# Linux: o GStreamer, carregado na hora (dlopen).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# macOS e iOS: o AVFoundation (as mesmas versões do objc2 que o winit usa).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry"] }

# Android: o MediaCodec do NDK (a mesma versão que o winit usa).
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6", features = ["media"] }
# A permissão da câmera e do microfone (pedida pela AylisActivity).
jni = "0.21"
ndk-context = "0.1"

# Navegador: o `<video>` do próprio navegador.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "Navigator",
    "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement", "HtmlMediaElement",
    "HtmlVideoElement", "ImageData", "MediaError", "Url", "Window",
] }

[dev-dependencies]
aylis-controls = { path = "../aylis-controls" }
# O Direct2D nos exemplos (o `video` mede o quadro como textura: AYLIS_RENDERER=d2d).
aylis-platform-winit = { path = "../aylis-platform-winit", features = ["d2d"] }
