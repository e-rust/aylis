[package]
name = "aylis-devlink"
description = "O canal de desenvolvimento do Aylis (app <-> IDE): Noise NKpsk0 sobre WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Noise (Rust puro, compila para wasm): X25519, ChaCha20-Poly1305 e BLAKE2s.
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# O gerador aleatório do navegador (o snow precisa para as chaves efêmeras).
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.26"
