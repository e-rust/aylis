[package]
name = "aylis-web"
description = "Renderizador do Aylis para navegadores: Canvas e TextService sobre o Canvas 2D"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.9.2", path = "../aylis-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasGradient",
    "CanvasWindingRule",
    "DomMatrix",
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "ImageData",
    "Url",
    "TextMetrics",
    "Window",
] }

# Os testes no navegador (tests/web_canvas.rs), pelo wasm-bindgen-test-runner: a versão casa com
# a do wasm-bindgen do Cargo.lock.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
wasm-bindgen-futures = "0.4.79"
aylis-vector = { path = "../aylis-vector" }
aylis-controls = { path = "../aylis-controls" }
