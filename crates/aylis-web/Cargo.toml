[package]
name = "aylis-web"
description = "Renderizador do Aylis para navegadores: Canvas e TextService sobre o Canvas 2D"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.2.0-beta.3", path = "../aylis-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasGradient",
    "CanvasWindingRule",
    "DomMatrix",
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "ImageData",
    "Url",
    "TextMetrics",
    "Window",
] }
