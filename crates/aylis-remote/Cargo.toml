[package]
name = "aylis-remote"
description = "Protocolo do Aylis: comandos e eventos em JSON para backends em qualquer linguagem"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aylis-core = { version = "0.1.0", path = "../aylis-core" }
aylis-json = { version = "0.1.0", path = "../aylis-json" }
aylis-data = { version = "0.1.0", path = "../aylis-data" }
aylis-controls = { version = "0.1.0", path = "../aylis-controls" }
aylis-dbcontrols = { version = "0.1.0", path = "../aylis-dbcontrols" }
aylis-providers = { version = "0.1.0", path = "../aylis-providers" }
aylis-media = { version = "0.1.0", path = "../aylis-media" }
aylis-vector = { version = "0.1.0", path = "../aylis-vector" }
aylis-markdown = { version = "0.1.0", path = "../aylis-markdown" }
aylis-webview = { version = "0.1.0", path = "../aylis-webview" }
aylis-project = { version = "0.1.0", path = "../aylis-project" }
serde_json = { version = "1", features = ["preserve_order"] }
# A compactação entre a ponte e a tela (Rust puro: vale no navegador também).
miniz_oxide = "0.8"

# O token do servidor MCP (o componente McpServer).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[dev-dependencies]
# O catálogo das classes (o acesso tipado nas linguagens) tem também as das features que o
# protocolo não registra: o 3D e o visualizador de documentos.
aylis-3d = { path = "../aylis-3d" }
aylis-docview = { path = "../aylis-docview" }
