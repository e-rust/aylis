[package]
name = "aylis-d2d"
description = "Renderizador do Aylis no Windows sem Skia: Direct2D (GPU) e DirectWrite, que já vêm no sistema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# As variáveis de diagnóstico (AYLIS_D2D_TARGET, AYLIS_D2D_DEBUG): a plataforma liga com a dela.
diagnostics = []

[dependencies]
aylis-core = { version = "0.2.0-beta.1", path = "../aylis-core" }

[target.'cfg(windows)'.dependencies]
windows-numerics = { version = "0.3", default-features = false }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
