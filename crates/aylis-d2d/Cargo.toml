[package]
name = "aylis-d2d"
description = "Renderizador do Aylis no Windows sem Skia: Direct2D (GPU) e DirectWrite, que já vêm no sistema"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# As variáveis de diagnóstico (AYLIS_D2D_TARGET, AYLIS_D2D_DEBUG): a plataforma liga com a dela.
diagnostics = []
# Também no build release (as medições do Aylis); o app nunca liga.
release-diagnostics = ["diagnostics"]

[dependencies]
aylis-core = { version = "0.10.1", path = "../aylis-core" }

[target.'cfg(windows)'.dependencies]
windows-numerics = { version = "0.3", default-features = false }
# Quais símbolos são emoji de apresentação de texto (`⚠`, `ℹ`): saem monocromáticos, como no
# Skia e no navegador. Só tabelas, sem dependências.
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct3D",
    # O D3DCompile do compositor da mistura (`blend_compositor = direct3d`).
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    # MonitorFromWindow e o monitor de cada saída do DXGI (a placa que segue o monitor).
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }

# O exemplo camera_frames abre uma janela escondida para medir com a swap chain.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
# Os testes que comparam o desenho com o do Skia (tests/compare_skia.rs, tests/color_glyphs.rs).
aylis-skia = { path = "../aylis-skia" }
