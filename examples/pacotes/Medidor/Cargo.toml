# Pacote de código (tipo B) de exemplo: o crate que vai no .aylispkg (aylis-tool pack-code).
# Quem usa num projeto Rust ganha a dependência no Cargo.toml e o `register` no código
# gerado; os caminhos do aylis abaixo são trocados pelos da máquina de quem instala.
[package]
name = "medidor-aylis"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
aylis-core = { path = "../../../crates/aylis-core" }
